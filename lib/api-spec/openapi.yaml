openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hyderabad Urban Flood Nowcasting System foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nowcasting
    description: Prototype nowcasting endpoints
paths:
  /:
    get:
      operationId: getSystemStatus
      tags: [health]
      summary: Get system status
      description: Returns the current prototype status and supported forecast horizon.
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Get application health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /forecast:
    get:
      operationId: getForecast
      tags: [nowcasting]
      summary: Get flood forecast placeholder
      responses:
        "200":
          description: Forecast model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /flood-depth:
    get:
      operationId: getFloodDepth
      tags: [nowcasting]
      summary: Get flood depth placeholder
      responses:
        "200":
          description: Flood depth model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /safe-route:
    get:
      operationId: getSafeRoute
      tags: [nowcasting]
      summary: Get safe route placeholder
      responses:
        "200":
          description: Safe route model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /data-status:
    get:
      operationId: getDataStatus
      tags: [health]
      summary: Validate configured source datasets
      description: Reads configured source datasets in memory and returns their actual validation status without modifying them.
      responses:
        "200":
          description: Dataset validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatusResponse"
components:
  schemas:
    SystemStatus:
      type: object
      properties:
        system:
          type: string
        status:
          type: string
        forecast_horizon_hours:
          type: integer
      required:
        - system
        - status
        - forecast_horizon_hours
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ModelPlaceholder:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
      required:
        - message
        - status
    DatasetStatus:
      type: object
      properties:
        dataset_key:
          type: string
        path:
          type: string
        dataset_type:
          type: string
          enum: [vector, raster, netcdf]
        exists:
          type: boolean
        readable:
          type: boolean
        validation_status:
          type: string
          enum: [valid, invalid, missing, unreadable]
        details:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - dataset_key
        - path
        - dataset_type
        - exists
        - readable
        - validation_status
        - details
        - errors
        - warnings
    DataStatusSummary:
      type: object
      properties:
        total:
          type: integer
        found:
          type: integer
        readable:
          type: integer
        valid:
          type: integer
        missing:
          type: integer
        unreadable:
          type: integer
        invalid:
          type: integer
      required:
        - total
        - found
        - readable
        - valid
        - missing
        - unreadable
        - invalid
    DataStatusResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        datasets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DatasetStatus"
        summary:
          $ref: "#/components/schemas/DataStatusSummary"
      required:
        - generated_at
        - datasets
        - summary

