openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hyderabad Urban Flood Nowcasting System foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: nowcasting
    description: Prototype nowcasting endpoints
paths:
  /:
    get:
      operationId: getSystemStatus
      tags: [health]
      summary: Get system status
      description: Returns the current prototype status and supported forecast horizon.
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Get application health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /forecast:
    get:
      operationId: getForecast
      tags: [nowcasting]
      summary: Get flood forecast placeholder
      responses:
        "200":
          description: Forecast model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /flood-depth:
    get:
      operationId: getFloodDepth
      tags: [nowcasting]
      summary: Get flood depth placeholder
      responses:
        "200":
          description: Flood depth model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /safe-route:
    get:
      operationId: getSafeRoute
      tags: [nowcasting]
      summary: Get safe route placeholder
      responses:
        "200":
          description: Safe route model placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPlaceholder"
  /data-status:
    get:
      operationId: getDataStatus
      tags: [health]
      summary: Validate configured source datasets
      description: Reads configured source datasets in memory and returns their actual validation status without modifying them.
      responses:
        "200":
          description: Dataset validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatusResponse"
  /preprocessing-status:
    get:
      operationId: getPreprocessingStatus
      tags: [health]
      summary: Get GIS preprocessing status
      description: Returns the latest reproducible preprocessing report for the available validated datasets.
      responses:
        "200":
          description: GIS preprocessing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreprocessingStatusResponse"
  /roads-status:
    get:
      operationId: getRoadsStatus
      tags: [health]
      summary: Get road network preprocessing status
      description: Returns the readiness and metadata of the OSMnx/Overpass GHMC drive network.
      responses:
        "200":
          description: Road network preprocessing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadsStatusResponse"
  /runoff-status:
    get:
      operationId: getRunoffStatus
      tags: [nowcasting]
      summary: Get rainfall-to-runoff prototype status
      description: Returns the readiness and alignment metadata of the transparent rainfall-to-runoff prototype.
      responses:
        "200":
          description: Runoff model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunoffStatusResponse"
  /runoff-summary:
    get:
      operationId: getRunoffSummary
      tags: [nowcasting]
      summary: Get rainfall-to-runoff summary statistics
      description: Returns statistics only after a successful runoff model run.
      responses:
        "200":
          description: Runoff summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunoffSummaryResponse"
        "404":
          description: Runoff model has not successfully run
  /surface-water-status:
    get:
      operationId: getSurfaceWaterStatus
      tags: [nowcasting]
      summary: Get prototype surface-water routing status
      description: Returns readiness and limitations for deterministic terrain-based surface-water accumulation.
      responses:
        "200":
          description: Surface-water model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceWaterStatusResponse"
  /surface-water-summary:
    get:
      operationId: getSurfaceWaterSummary
      tags: [nowcasting]
      summary: Get prototype surface-water summary statistics
      description: Returns real statistics from the generated terrain-based surface-water rasters.
      responses:
        "200":
          description: Surface-water summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceWaterSummaryResponse"
        "404":
          description: Surface-water model has not successfully run
  /drainage-status:
    get:
      operationId: getDrainageStatus
      tags: [nowcasting]
      summary: Get prototype drainage interaction status
      description: Returns mapped-nala interaction and dimensionless capacity-index readiness.
      responses:
        "200":
          description: Drainage model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainageStatusResponse"
  /drainage-summary:
    get:
      operationId: getDrainageSummary
      tags: [nowcasting]
      summary: Get prototype drainage interaction statistics
      responses:
        "200":
          description: Drainage model summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainageSummaryResponse"
        "404":
          description: Drainage model has not successfully run
  /flood-depth-status:
    get:
      operationId: getFloodDepthStatus
      tags: [nowcasting]
      summary: Get prototype flood-depth screening status
      responses:
        "200":
          description: Flood-depth model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloodDepthStatusResponse"
  /flood-depth-summary:
    get:
      operationId: getFloodDepthSummary
      tags: [nowcasting]
      summary: Get prototype flood-depth screening statistics
      responses:
        "200":
          description: Flood-depth summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloodDepthSummaryResponse"
        "404":
          description: Flood-depth model has not successfully run
  /road-flood-risk:
    get:
      operationId: getRoadFloodRisk
      tags: [nowcasting]
      summary: Get processed road flood-risk artifact status
      description: Returns metadata and the path for the generated road_flood_risk GeoJSON artifact.
      responses:
        "200":
          description: Road flood-risk summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadFloodRiskResponse"
        "404":
          description: Flood-depth model has not successfully run
components:
  schemas:
    SystemStatus:
      type: object
      properties:
        system:
          type: string
        status:
          type: string
        forecast_horizon_hours:
          type: integer
      required:
        - system
        - status
        - forecast_horizon_hours
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ModelPlaceholder:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
      required:
        - message
        - status
    DatasetStatus:
      type: object
      properties:
        dataset_key:
          type: string
        path:
          type: string
        dataset_type:
          type: string
          enum: [vector, raster, netcdf]
        exists:
          type: boolean
        readable:
          type: boolean
        validation_status:
          type: string
          enum: [valid, invalid, missing, unreadable]
        details:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - dataset_key
        - path
        - dataset_type
        - exists
        - readable
        - validation_status
        - details
        - errors
        - warnings
    DataStatusSummary:
      type: object
      properties:
        total:
          type: integer
        found:
          type: integer
        readable:
          type: integer
        valid:
          type: integer
        missing:
          type: integer
        unreadable:
          type: integer
        invalid:
          type: integer
      required:
        - total
        - found
        - readable
        - valid
        - missing
        - unreadable
        - invalid
    DataStatusResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        datasets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DatasetStatus"
        summary:
          $ref: "#/components/schemas/DataStatusSummary"
      required:
        - generated_at
        - datasets
        - summary
    PreprocessingStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [not_run, completed_with_warnings, failed]
        generated_at:
          type: string
          format: date-time
          nullable: true
        datasets:
          type: array
          items:
            type: object
            additionalProperties: true
        available_processed_datasets:
          type: array
          items:
            type: string
        feature_counts:
          type: object
          additionalProperties: true
        raster_information:
          type: object
          additionalProperties: true
        rainfall_information:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
      required:
        - status
        - datasets
        - available_processed_datasets
        - feature_counts
        - raster_information
        - rainfall_information
        - warnings
        - errors
    RoadsStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [not_ready, ready, error]
        ready:
          type: boolean
        number_nodes:
          type: integer
        number_edges:
          type: integer
        crs:
          type: string
        bounding_box:
          type: array
          items:
            type: number
        network_type:
          type: string
        retrieval_timestamp:
          type: string
          format: date-time
        output_paths:
          type: object
          additionalProperties:
            type: string
        important_osm_tags_preserved:
          type: array
          items:
            type: string
        overpass_errors:
          type: array
          items:
            type: string
      required:
        - status
        - ready
        - number_nodes
        - number_edges
        - output_paths
        - overpass_errors
    RunoffStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [not_run, not_ready, ready, error]
        model_status:
          type: string
        rainfall_provider:
          type: string
          nullable: true
        rainfall_timestamp:
          type: string
          nullable: true
        rainfall_available_start:
          type: string
          nullable: true
        rainfall_available_end:
          type: string
          nullable: true
        rainfall_scenario:
          type: string
          nullable: true
        output_availability:
          type: object
          additionalProperties:
            type: string
        coefficient_configuration_status:
          type: string
        crs:
          type: string
          nullable: true
        raster_dimensions:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        raster_resolution_m:
          type: array
          nullable: true
          items:
            type: number
        warnings:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
      required:
        - status
        - model_status
        - output_availability
        - coefficient_configuration_status
        - warnings
        - limitations
    RunoffSummaryResponse:
      type: object
      properties:
        status:
          type: string
        minimum_runoff_depth_mm:
          type: number
          nullable: true
        maximum_runoff_depth_mm:
          type: number
          nullable: true
        mean_runoff_depth_mm:
          type: number
          nullable: true
        total_runoff_volume_m3:
          type: number
          nullable: true
        valid_cell_count:
          type: integer
        rainfall_provider:
          type: string
        rainfall_timestamp:
          type: string
        rainfall_scenario:
          type: string
        crs:
          type: string
      required:
        - status
        - minimum_runoff_depth_mm
        - maximum_runoff_depth_mm
        - mean_runoff_depth_mm
        - total_runoff_volume_m3
        - valid_cell_count
        - rainfall_provider
        - rainfall_timestamp
        - rainfall_scenario
        - crs
    SurfaceWaterStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [not_run, not_ready, ready, error]
        model_status:
          type: string
        ready:
          type: boolean
        output_availability:
          type: object
          additionalProperties:
            type: string
        dem_information:
          type: object
          additionalProperties: true
        runoff_scenario:
          type: object
          nullable: true
          additionalProperties: true
        terrain_routing_method:
          type: string
          nullable: true
        drainage_assumption_status:
          type: string
        warnings:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
      required:
        - status
        - model_status
        - ready
        - output_availability
        - dem_information
        - drainage_assumption_status
        - warnings
        - limitations
    SurfaceWaterSummaryResponse:
      type: object
      properties:
        status:
          type: string
        rainfall_timestamp:
          type: string
        rainfall_scenario:
          type: string
        valid_cell_count:
          type: integer
        maximum_surface_water_depth_mm:
          type: number
          nullable: true
        maximum_surface_water_depth_cm:
          type: number
          nullable: true
        mean_surface_water_depth_mm:
          type: number
          nullable: true
        total_surface_water_volume_m3:
          type: number
        threshold_cell_counts:
          type: object
          additionalProperties:
            type: integer
        nala_interaction_cell_count:
          type: integer
        water_body_cell_count:
          type: integer
        input_runoff_volume_m3:
          type: number
        prototype_drainage_removed_volume_m3:
          type: number
        volume_conservation_error_m3:
          type: number
        volume_conservation_check:
          type: boolean
      required:
        - status
        - valid_cell_count
        - maximum_surface_water_depth_mm
        - maximum_surface_water_depth_cm
        - mean_surface_water_depth_mm
        - total_surface_water_volume_m3
        - threshold_cell_counts
        - nala_interaction_cell_count
        - water_body_cell_count
        - input_runoff_volume_m3
        - prototype_drainage_removed_volume_m3
        - volume_conservation_error_m3
        - volume_conservation_check
    DrainageStatusResponse:
      type: object
      additionalProperties: true
      required: [status, model_status, ready, output_availability, assumption_status, warnings, limitations]
    DrainageSummaryResponse:
      type: object
      additionalProperties: true
      required: [status]
    FloodDepthStatusResponse:
      type: object
      additionalProperties: true
      required: [status, model_status, ready, output_availability, assumption_status, warnings, limitations]
    FloodDepthSummaryResponse:
      type: object
      additionalProperties: true
      required: [status]
    RoadFloodRiskResponse:
      type: object
      additionalProperties: true
      required: [status, output]

